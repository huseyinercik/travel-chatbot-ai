
description: "RAG - Faithfulness Evaluation"

prompts:
  - "{{input}}"

providers:
  - id: http
    config:
      url: http://127.0.0.1:8000/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        input: "{{input}}"
      transformResponse: json.output

tests:
  - description: "RAG - Kaynak metne sadakat"
    vars:
      input: |
        Kaynak metin:
        Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır.
        Bölgenin önemli turistik merkezlerinden biri Nevşehir'dir.

        Soru: Kapadokya hangi bölgede bulunur?
        Kaynak metne dayanarak cevap ver.
    assert:
      - type: llm-rubric
        value: |
          Cevap yalnızca verilen kaynak metne dayanmalıdır.
          Kapadokya'nın İç Anadolu Bölgesi'nde olduğunu belirtmelidir.
          Kaynak metinle çelişen bilgiler vermemelidir.

  - description: "RAG - Context Faithfulness"
    vars:
      query: "Kapadokya hangi bölgede bulunur?"
      context: "Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır."
      input: |
        Kaynak metin:
        Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır.

        Soru: Kapadokya hangi bölgede bulunur?
        Kaynak metne dayanarak cevap ver.
    assert:
      - type: context-faithfulness
        threshold: 0.7

  - description: "RAG - Context Relevance"
    vars:
      query: "Kapadokya hangi bölgede bulunur?"
      context: "Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır. Nevşehir önemli turizm merkezlerinden biridir."
      input: |
        Kaynak metin:
        Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır.
        Nevşehir önemli turizm merkezlerinden biridir.

        Soru: Kapadokya hangi bölgede bulunur?
        Kaynak metne dayanarak cevap ver.
    assert:
      - type: context-relevance
        threshold: 0.7

  - description: "RAG - Context Recall"
    vars:
      query: "Kapadokya hangi bölgede bulunur?"
      context: "Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır."
      input: |
        Kaynak metin:
        Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır.

        Soru: Kapadokya hangi bölgede bulunur?
        Kaynak metne dayanarak cevap ver.
    assert:
      - type: context-recall
        value: "Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır."
        threshold: 0.7


  - description: "RAG - Context Relevance - Tamamen ilgili kaynak"
    vars:
      query: "Kapadokya hangi bölgede bulunur?"
      context: "Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır."
      input: |
        Kaynak metin:
        Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde yer alır.

        Soru: Kapadokya hangi bölgede bulunur?
        Kaynak metne dayanarak cevap ver.
    assert:
      - type: context-relevance
        threshold: 0.7
