# - description: "78 - Complex Request - Aile, bütçe ve erişilebilirlik"
#   vars:
#     input: "Üç kişilik aile olarak Kocaeli'den çıkacağız. Bir çocuk 6 yaşında. İki günlük gezi istiyoruz. Toplam bütçemiz 6.000 TL. Uzun yürüyüş istemiyoruz ve mümkün olduğunca çocuk dostu yerleri görmek istiyoruz. Bize uygun bir destinasyon ve plan öner."
#   assert:
#     - type: llm-rubric
#       metric: Complex Instruction Following
