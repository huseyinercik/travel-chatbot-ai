- description: "34 - Context Retention - Önceki öneriye yönelik takip sorusu"
  vars:
    input: |
      Konuşma geçmişi:
      Kullanıcı: İzmir'de tarihi yerleri gezmek istiyorum.
      Asistan: Efes Antik Kenti ve Bergama öne çıkan seçeneklerdir.
      Kullanıcı: Efes'i tercih ederim.
      Son kullanıcı mesajı: Oraya gidersem yakınlarda başka nereleri görebilirim?
  assert:
    - type: llm-rubric
      metric: Context Retention
      weight: 2
      value: "Yanıt, 'oraya' ifadesini Efes Antik Kenti olarak yorumlar ve Efes çevresindeki uygun ziyaret noktalarına odaklanır. Bergama'yı veya İzmir'in uzak bölgelerini yakın çevreymiş gibi sunmaz."

- description: "35 - Preference Personalization - Kalabalıktan kaçınma tercihi"
  vars:
    input: |
      Kullanıcı tercihleri:
      - Kalabalık turistik yerlerden hoşlanmıyorum.
      - Daha sakin ve doğayla iç içe yerleri tercih ediyorum.
      İstek: Türkiye'de üç günlük bir gezi için destinasyon öner.
  assert:
    - type: llm-rubric
      metric: Preference Personalization
      weight: 3
      value: "Öneriler, sakinlik ve doğayla iç içe olma tercihleriyle anlamlı biçimde örtüşür. Yalnızca Türkiye'nin en popüler ve kalabalık turistik merkezlerini sıralamaz. Her önerinin tercihle neden uyumlu olduğunu açıklar."

- description: "36 - Preference Personalization - Düşük bütçeye uygun öneri"
  vars:
    input: |
      Kullanıcı tercihleri:
      - Seyahat bütçem sınırlı.
      - Lüks otel ve pahalı restoran istemiyorum.
      - Mümkün olduğunca ekonomik ulaşım tercih ediyorum.
      İstek: İstanbul'da iki günlük gezi öner.
  assert:
    - type: llm-rubric
      metric: Preference Personalization
      weight: 3
      value: "Plan, ekonomik ulaşım ve düşük maliyetli konaklama/yemek seçeneklerine öncelik verir. Lüks otel veya pahalı restoranları ana öneri olarak sunmaz. Güncel fiyatlar doğrulanamıyorsa kesin fiyat iddiasında bulunmaz."

- description: "37 - Preference Personalization - Çocuklu aileye uygun öneri"
  vars:
    input: |
      Kullanıcı tercihleri:
      - İki yetişkin ve 6 yaşında bir çocukla seyahat ediyoruz.
      - Çocuğun sıkılmayacağı, ailece yapılabilecek aktiviteler istiyoruz.
      İstek: Eskişehir için iki günlük gezi planı hazırla.
  assert:
    - type: llm-rubric
      metric: Preference Personalization
      weight: 3
      value: "Plan, küçük çocukla seyahat eden aileye uygun aktiviteler ve makul tempo içerir. Çocuk için uygun olmayabilecek yoğun veya yorucu etkinlikleri tek seçenek olarak dayatmaz. Aile koşulunu önerilere yansıtır."

- description: "38 - Preference Personalization - Yürüyüş kısıtına uygun plan"
  vars:
    input: |
      Kullanıcı tercihleri:
      - Uzun mesafe yürüyemiyorum.
      - Toplu taşıma veya kısa taksi yolculuklarını tercih ediyorum.
      İstek: İstanbul'da tarihi yerleri kapsayan bir günlük rota oluştur.
  assert:
    - type: llm-rubric
      metric: Preference Personalization
      weight: 3
      value: "Rota, uzun yürüyüş gerektirmeyecek şekilde düzenlenir. Ulaşım bağlantıları veya kısa araç yolculukları dikkate alınır. Birbirinden uzak noktaları arka arkaya ekleyerek kullanıcının hareket kısıtını görmezden gelmez."

- description: "39 - Constraint Satisfaction - Çelişkili seyahat kısıtları"
  vars:
    input: |
      İstanbul'dan Kapadokya'ya günübirlik gezi planlamak istiyorum.
      Uçak kullanmak istemiyorum.
      Otobüs veya özel araç da kullanmayacağım.
      Trenle gitmek istiyorum.
      Ancak tek yön yolculuk en fazla 2 saat sürmeli.
      Bu koşullara uygun bir gezi planı hazırla.
  assert:
    - type: llm-rubric
      metric: Constraint Satisfaction
      weight: 3
      value: |
        Yanıtı aşağıdaki kriterlere göre değerlendir:

        1. Kullanıcının ulaşım tercihlerini ve maksimum
           2 saatlik tek yön yolculuk sınırını dikkate almalıdır.

        2. Belirtilen koşulların tamamını karşılayan
           uygulanabilir bir seyahat planı bulunmadığını
           açıkça ifade etmelidir.

        3. Gerçek dışı tren seferleri, güzergâhlar veya
           yolculuk süreleri uydurmamalıdır.

        4. Kullanıcının reddettiği ulaşım yöntemlerini
           koşulları karşılıyormuş gibi önermemelidir.

        5. Koşullardan hangisinin esnetilebileceğini
           kullanıcıya sormalı veya uygulanabilir
           alternatifleri açıkça koşullu sunmalıdır.

        PASS:
        Kısıtların birlikte karşılanamayacağını doğru
        değerlendirir ve uygulanamaz bir plan üretmez.

        FAIL:
        Kısıtları ihlal eden bir planı uygulanabilir
        gibi sunar veya gerçek dışı ulaşım bilgisi üretir.

- description: "40 - Preference Personalization - Kültür ve tarih odaklı öneri"
  vars:
    input: |
      Kullanıcı tercihleri:
      - Tarihi yapılar ve müzeler ilgimi çekiyor.
      - Gece hayatı ve plaj tatili istemiyorum.
      - Gezi sırasında kültürel bilgi edinmek istiyorum.
      İstek: Türkiye'de dört günlük bir gezi için şehir öner ve kısa bir plan oluştur.
  assert:
    - type: llm-rubric
      metric: Preference Personalization
      weight: 3
      value: "Şehir ve gezi planı tarih, müze ve kültürel deneyim odaklıdır. Gece hayatı veya plaj tatilini ana tema yapmaz. Önerilen yerlerin kültürel açıdan neden uygun olduğunu açıklar."

- description: "41 - Uncertainty Management - Yanlış şehir varsayımını düzeltme"
  vars:
    input: "Kapadokya'nın Antalya'da olduğunu biliyorum. Antalya merkezden oraya günübirlik nasıl giderim?"
  assert:
    - type: llm-rubric
      metric: Uncertainty Management
      weight: 3
      value: "Yanlış coğrafi varsayımı nazikçe düzeltir. Kapadokya'nın Antalya'da olduğunu onaylamaz. Kapadokya'nın tek bir şehir değil, ağırlıklı olarak Nevşehir ve çevresindeki illeri kapsayan bir bölge olduğunu doğru açıklar. Ulaşım önerilerini bu düzeltmeye göre verir."

- description: "42 - Uncertainty Management - Var olmayan destinasyon iddiasını doğrulamama"
  vars:
    input: "Türkiye'deki Zümrüt Kristal Müzesi'ni ziyaret etmek istiyorum. Hangi şehirde ve giriş ücreti ne kadar?"
  assert:
    - type: llm-rubric
      metric: Hallucination Resistance
      weight: 3
      value: "Müzenin varlığını doğrulayamadığını açıkça belirtir. Bir şehir, adres, çalışma saati veya giriş ücreti uydurmaz. Kullanıcıdan kastettiği yerin başka bir adı olup olmadığını sorabilir."

- description: "43 - Uncertainty Management - Belirsiz konum talebinde açıklama isteme"
  vars:
    input: "Hafta sonu yakınlarda güzel bir yere gitmek istiyorum. Bana rota hazırla."
  assert:
    - type: llm-rubric
      metric: Clarification
      weight: 2
      value: "Başlangıç konumunun belirtilmediğini fark eder. Yakın çevreye göre rota oluşturabilmek için şehir veya başlangıç noktası sorar. Konumunu biliyormuş gibi varsayım yapmaz."

- description: "44 - Uncertainty Management - Güncel fiyatı uydurmama"
  vars:
    input: "Bugün İstanbul'dan Ankara'ya giden otobüs biletlerinin en ucuzu kaç TL? Bana kesin fiyat söyle."
  assert:
    - type: llm-rubric
      metric: Current Information Reliability
      weight: 3
      value: "Canlı fiyat bilgisine erişimi olmadığını veya fiyatı doğrulayamadığını belirtir. Kesin güncel bilet fiyatı uydurmaz. Kullanıcıyı otobüs firmalarının veya güvenilir bilet platformlarının güncel sonuçlarını kontrol etmeye yönlendirir."

- description: "45 - Uncertainty Management - Yanlış tarihi nazikçe düzeltme"
  vars:
    input: "29 Şubat 2027 tarihinde İstanbul'da yapılacak etkinliklere gitmek istiyorum. Bana program çıkar."
  assert:
    - type: llm-rubric
      metric: Date Consistency
      weight: 2
      value: "2027 yılının artık yıl olmadığını ve 29 Şubat tarihinin bulunmadığını fark eder. Bu tarihte etkinlik varmış gibi program üretmez. Kullanıcıdan geçerli bir tarih seçmesini ister."

- description: "46 - Uncertainty Management - Doğrulanmamış açık olma bilgisini sunmama"
  vars:
    input: "Şu anda Efes Antik Kenti kesin açık mı? Bugün giriş yapabilir miyim?"
  assert:
    - type: llm-rubric
      metric: Current Information Reliability
      weight: 3
      value: "Güncel çalışma saatlerini ve olası kapanışları doğrulayamadığında kesin açık veya kapalı olduğunu iddia etmez. Resmî kaynaklardan kontrol edilmesini önerir."

- description: "47 - Uncertainty Management - Kesin olmayan hava tahminini belirtme"
  vars:
    input: "Üç ay sonraki Kapadokya gezimde kesinlikle kar yağacak mı? Buna göre rezervasyon yapacağım."
  assert:
    - type: llm-rubric
      metric: Uncertainty Management
      weight: 2
      value: "Üç ay sonrası için kesin hava durumu garantisi vermez. Mevsimsel eğilim ile belirli güne ait hava tahminini birbirinden ayırır. Rezervasyon kararında esnek veya iptal edilebilir seçenekleri değerlendirmeyi önerebilir."

- description: "48 - Uncertainty Management - Kullanıcının doğrulanmamış iddiasını sorgulama"
  vars:
    input: "İstanbul'dan Kapadokya'ya 30 dakikada trenle gidebildiğimi duydum. Hangi trene binmeliyim?"
  assert:
    - type: llm-rubric
      metric: Assumption Correction
      weight: 3
      value: "30 dakikalık tren yolculuğu iddiasını doğru kabul etmez. İstanbul-Kapadokya arasında bu şekilde doğrudan ve 30 dakikalık bir tren yolculuğu varmış gibi sefer veya istasyon uydurmaz. Gerçekçi ulaşım seçeneklerini genel hatlarıyla açıklar ve güncel seferlerin doğrulanması gerektiğini belirtir."

# - description: "49 - Constraint Optimization - Bütçe ve süre kısıtlarını birlikte karşılama"
#   vars:
#     input: "İki kişiyiz. İstanbul'dan çıkacağız. Toplam bütçemiz 8.000 TL ve yalnızca iki günümüz var. Ulaşım, yemek ve konaklama dahil bir gezi planı hazırla."
#   assert:
#     - type: llm-rubric
#       metric: Constraint Satisfaction
#       weight: 3
#       value: "Plan iki kişi, iki gün ve toplam 8.000 TL bütçe koşullarını birlikte ele alır. Ulaşım, yemek ve konaklama giderlerini ayrı ayrı tahmin eder, toplamı hesaplar ve bütçeyle karşılaştırır. Varsayımlarını açıklar; hesap yapmadan bütçeye uyulduğunu iddia etmez."

- description: "50 - Constraint Optimization - Aktarma ve yürüyüş kısıtları"
  vars:
    input: "Ankara'da bir günlük gezi istiyorum. Toplu taşıma kullanacağım, en fazla iki aktarma yapmak istiyorum ve uzun yürüyüş yapamam. Bir rota öner."
  assert:
    - type: llm-rubric
      metric: Constraint Satisfaction
      weight: 3
      value: "Rota toplu taşıma, en fazla iki aktarma ve kısa yürüyüş koşullarını dikkate alır. Birbirinden uzak noktaları gereksiz yere birleştirmez. Doğrulanmamış hat veya sefer ayrıntılarını kesin bilgi gibi sunmaz."

- description: "51 - Constraint Optimization - Çocuk ve yetişkin ihtiyaçlarını dengeleme"
  vars:
    input: "İki yetişkin ve 6 yaşında bir çocukla üç günlük İstanbul gezisi planla. Tarihi yerleri görmek istiyoruz ama çocuk için de eğlenceli aktiviteler olsun. Her gün çok yoğun olmasın."
  assert:
    - type: llm-rubric
      metric: Constraint Satisfaction
      weight: 3
      value: "Plan kültürel ve tarihi ziyaretleri çocuk dostu etkinliklerle dengeler. Günlük programı aşırı yoğun tutmaz. Çocuğun yaşını ve ailece seyahat edildiğini dikkate alır."

- description: "52 - Constraint Optimization - Vejetaryen beslenme ve bütçe"
  vars:
    input: "İzmir'de iki günlük gezi planla. Vejetaryen besleniyorum, günlük yemek bütçem 600 TL ve toplu taşıma kullanmak istiyorum."
  assert:
   - type: llm-rubric
  metric: Constraint Satisfaction
  weight: 3
  value: "Öneriler vejetaryen beslenme koşuluna uyar. Günlük yemek harcamalarını 600 TL bütçesiyle ayrı ayrı karşılaştırır; ulaşım giderlerini yemek bütçesine dahil etmez. İki günlük yemek toplamını günlük bütçeyle karıştırmaz. Toplu taşımaya öncelik verir. Güncel restoran fiyatlarını doğrulanmış gibi sunmaz. Günlük yemek gideri 600 TL'yi aşmıyorsa, ulaşım dahil genel gezi toplamı 600 TL'yi aşsa bile bütçe koşulunu karşılamış sayılır."

- description: "53 - Constraint Optimization - Zaman penceresi ve ziyaret önceliği"
  vars:
    input: "Bursa'da saat 10.00 ile 16.00 arasında gezebilirim. Tarihi yerleri önceliklendiriyorum. En fazla üç yer görmek istiyorum ve öğle yemeği için bir saat ayırmalıyım."
  assert:
    - type: llm-rubric
      metric: Constraint Satisfaction
      weight: 3
      value: "Plan 10.00-16.00 zaman aralığını aşmaz, en fazla üç ziyaret noktası içerir ve öğle yemeği için bir saat ayırır. Tarihi yerlere öncelik verir. Ziyaret süreleri ve ulaşım için gerçekçi zaman payı bırakır."

