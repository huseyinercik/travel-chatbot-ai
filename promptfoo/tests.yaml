#     input: "İstanbul'dan başlayarak üç günlük Bursa gezisi planla. Tarihi yerleri görmek, yöresel yemekleri denemek ve toplu taşıma kullanmak istiyorum. Günlük programı sabah, öğle ve akşam olarak ayır. Her gün için ulaşım ve yaklaşık harcama kalemlerini de belirt. Toplam bütçem 7.000 TL."
