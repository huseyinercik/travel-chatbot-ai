- description: "Not Contains - Yanlis bilgi bulunmamali"
  vars:
    input: "Türkiye'nin başkenti neresidir?"
  assert:
    - type: not-contains
      value: "İstanbul"

- description: "Contains Any - Bolge ifadelerinden biri"
  vars:
    input: "Kapadokya hangi bölgede bulunur?"
  assert:
    - type: contains-any
      value:
        - "İç Anadolu"
        - "Anadolu Bölgesi"

- description: "Contains All - Temel bilgiler"
  vars:
    input: "Kapadokya hangi bölgede bulunur?"
  assert:
    - type: contains-all
      value:
        - "Kapadokya"
        - "Orta Anadolu"

- description: "Latency - Yanit suresi"
  vars:
    input: "Türkiye'nin başkenti neresidir?"
  assert:
    - type: latency
      threshold: 5000

- description: "Factuality - Referans cevapla tutarlilik"
  vars:
    input: "Türkiye'nin başkenti neresidir?"
  assert:
    - type: factuality
      value: "Türkiye'nin başkenti Ankara'dır."

- description: "Factuality - Cevap gerçekten doğru mu?"
  vars:
    input: "Kapadokya hangi bölgede bulunur?"
  assert:
    - type: factuality
      value: "Kapadokya, Türkiye'nin İç Anadolu Bölgesi'nde (Orta Anadolu olarak da bilinir) yer almaktadır."
      