- description: "Türkiye'nin başkenti"
  vars:
    input: "Türkiye'nin başkenti neresidir?"
  assert:
    - type: contains
      value: "Ankara"

- description: "Kapadokya'nın bulunduğu bölge"
  vars:
    input: "Kapadokya hangi bölgede bulunur?"
  assert:
    - type: contains
      value: "Anadolu Bölgesi"

- description: "Kapadokya cevabının anlamsal doğruluğu"
  vars:
    input: "Kapadokya hangi bölgede bulunur?"
  assert:
    - type: llm-rubric
      value: |
        Yanıt, Kapadokya'nın Türkiye'nin İç Anadolu Bölgesi'nde
        bulunduğunu doğru biçimde belirtmelidir.
        Yalnızca coğrafi açıdan doğru ve soruyla ilgili yanıtları
        başarılı kabul et.


- description: "Answer Relevance - Soruyu gerçekten yanıtlıyor mu?"
  vars:
    input: "Kapadokya hangi bölgede bulunur?"
  assert:
    - type: llm-rubric
      value: |
        Yanıt, kullanıcının Kapadokya'nın hangi coğrafi bölgede
        bulunduğu sorusunu doğrudan yanıtlamalıdır.
        İç Anadolu Bölgesi'nde bulunduğunu belirtmelidir.
        Yalnızca Kapadokya'nın turistik özelliklerini anlatan
        ancak bulunduğu bölgeyi belirtmeyen yanıt başarısız olmalıdır.



