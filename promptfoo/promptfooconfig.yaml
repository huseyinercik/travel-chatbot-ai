description: "Travel Chatbot Evaluation"

prompts:
  - "{{input}}"

providers:
  - id: http
    config:
      url: http://127.0.0.1:8000/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        input: "{{prompt}}"
      transformResponse: "json.output"

defaultTest:
  options:
    provider:
      text:
        id: openai:gpt-4o-mini
      embedding:
        id: openai:embedding:text-embedding-3-small
    factuality:
      subset: 0.8
      superset: 0.7
      agree: 1.0
      disagree: 0.0
      differButFactual: 0.9

tests: file://tests.yaml