
name: Travel Chatbot Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normal-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Promptfoo
        run: npm install --global promptfoo@0.124.1

      - name: Start chatbot API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          cat api.log
          echo "API failed to start"
          exit 1

      - name: Run normal Promptfoo evaluation
        working-directory: promptfoo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          promptfoo eval --no-cache --max-concurrency 1 --verbose -o results.json

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-evaluation-results
          path: |
            promptfoo/results.json
            api.log
          if-no-files-found: ignore
          retention-days: 14
